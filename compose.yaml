# Local development dependencies only. This file intentionally publishes
# database port on loopback and is not a production deployment.
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: someday
      POSTGRES_USER: someday
      POSTGRES_PASSWORD: someday
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U someday -d someday"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
