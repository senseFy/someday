# Local development dependencies only. This file intentionally publishes
# database port on loopback and is not a production deployment.
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: someday
      POSTGRES_USER: someday
      POSTGRES_PASSWORD: someday
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U someday -d someday"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
