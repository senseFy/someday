# Local development dependencies only. This file intentionally publishes
# database and WebDAV ports on loopback and is not a production deployment.
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: someday
      POSTGRES_USER: someday
      POSTGRES_PASSWORD: someday
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U someday -d someday"]
      interval: 2s
      timeout: 3s
      retries: 20

  webdav:
    image: bytemark/webdav:2.4@sha256:bcabbc024c511b9c63ed3345f88573e31d84c952ee493c9acb3fe345f4f80f57
    environment:
      AUTH_TYPE: Basic
      USERNAME: someday
      PASSWORD: someday
      LOCATION: /
    ports:
      - "127.0.0.1:3182:80"
    volumes:
      - webdav-data:/var/lib/dav

volumes:
  postgres-data:
  webdav-data:
