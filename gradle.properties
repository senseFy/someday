org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false

# V2-only product: both flags default off so any release/package task is fail-safe.
# Local debug/run targets should pass -Psomeday.systemV2DevelopmentEnabled=true
# (or use DEBUG on Android) when intentionally exercising first-epoch activation.
# See docs/sync-system-v2-spec.md status.
someday.systemV2ReleaseEnabled=false
someday.systemV2DevelopmentEnabled=false
