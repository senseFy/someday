name: Server Release

on:
  push:
    tags:
      - 'server-v*.*.*'

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/sensefy/someday-server

jobs:
  validate:
    name: Validate immutable release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and image identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^server-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            printf 'Server release tags must match server-vX.Y.Z: %s\n' "$tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          image="$IMAGE_REPOSITORY:$version"
          [[ "$(git rev-parse "$tag^{commit}")" == "$GITHUB_SHA" ]]
          ./scripts/verify-server-release-contract "$tag" "$image"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'image=%s\n' "$image"
          } >>"$GITHUB_OUTPUT"

      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"
          case "$status" in
            404)
              ;;
            200)
              printf 'GitHub Release already exists: %s\n' "$RELEASE_TAG" >&2
              exit 1
              ;;
            *)
              printf 'Could not verify GitHub Release absence (HTTP %s):\n' \
                "$status" >&2
              sed -n '1,40p' "$response_file" >&2
              exit 1
              ;;
          esac

  publish-image:
    name: Publish AMD64 and ARM64 image
    needs:
      - validate
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse an existing image tag
        env:
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if docker buildx imagetools inspect "$RELEASE_IMAGE" \
            >/dev/null 2>"$error_file"; then
            printf 'GHCR tag already exists and will not be overwritten: %s\n' \
              "$RELEASE_IMAGE" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found' "$error_file"; then
            printf 'Could not prove that the GHCR tag is unused:\n' >&2
            cat "$error_file" >&2
            exit 1
          fi

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.title=Someday Server
            org.opencontainers.image.description=Self-hosted synchronization server for Someday
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push the immutable image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Someday Server
            index:org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-release
          cache-to: type=gha,mode=max,scope=server-release

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf '### Published server image\n\n'
            printf -- '- Image: `%s`\n' "$RELEASE_IMAGE"
            printf -- '- Digest: `%s`\n' "$DIGEST"
          } >>"$GITHUB_STEP_SUMMARY"

  quality:
    name: Source and System V3 release gates
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Install Docker Compose 2.20.0
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v2.20.0

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          rg --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager_path" --licenses --channel=3 >/dev/null
          set -o pipefail
          "$sdkmanager_path" --channel=3 \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0'

      - name: Run hermetic checks
        run: ./gradlew check --dependency-verification=strict --max-workers=2 --stacktrace

      - name: Run the complete System V3 gate
        run: ./scripts/sync-v3-reliability-gate

      - name: Check release commit whitespace
        run: git show --check --format= --no-ext-diff "$GITHUB_SHA" >/dev/null

  public-image:
    name: Anonymous image and manifest gate
    needs:
      - validate
      - publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Wait for anonymous GHCR access
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          printf '%s\n' \
            'For the first package, change GHCR visibility to public while this step waits.' \
            'Later releases should pass immediately because package visibility is retained.'
          for attempt in $(seq 1 120); do
            if manifest="$(
              docker buildx imagetools inspect "$RELEASE_IMAGE" \
                --format '{{json .}}' 2>/dev/null
            )" &&
              jq -e --arg digest "$DIGEST" \
                '.manifest.digest == $digest' <<<"$manifest" >/dev/null; then
              printf 'Anonymous pull is available after %s attempt(s).\n' "$attempt"
              printf '%s\n' "$manifest" >manifest.json
              break
            fi
            if ((attempt == 120)); then
              printf '%s\n' \
                'Anonymous GHCR access was not enabled within 30 minutes.' \
                'The image was already pushed, so this version must not be reused.' \
                'Make the package public and rerun failed jobs in this workflow.' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify digest and platform set
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          jq -e --arg digest "$DIGEST" '.manifest.digest == $digest' \
            manifest.json >/dev/null
          jq -e '
            [
              .manifest.manifests[]
              | select(.platform.os == "linux")
              | "\(.platform.os)/\(.platform.architecture)"
            ]
            | unique
            | sort
            | . == ["linux/amd64", "linux/arm64"]
          ' manifest.json >/dev/null
          ./scripts/verify-server-release-contract \
            "$RELEASE_TAG" "$RELEASE_IMAGE" "$DIGEST"
          docker pull --platform linux/amd64 "$RELEASE_IMAGE" >/dev/null
          resolved="$(
            docker image inspect \
              --format '{{index .RepoDigests 0}}' "$RELEASE_IMAGE"
          )"
          [[ "$resolved" == "$IMAGE_REPOSITORY@$DIGEST" ]]

  runtime-smoke:
    name: ${{ matrix.label }} runtime
    needs:
      - validate
      - publish-image
      - public-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: AMD64
            platform: linux/amd64
            topology: standalone
          - label: ARM64
            platform: linux/arm64
            topology: standalone

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Install Docker Compose 2.20.0
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v2.20.0

      - name: Confirm the minimum Compose gate
        run: test "$(docker compose version --short)" = '2.20.0'

      - name: Start the release image from copied deploy files
        env:
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}@${{ needs.publish-image.outputs.digest }}
        run: |
          ./scripts/server-release-compose-smoke \
            --image "$RELEASE_IMAGE" \
            --platform '${{ matrix.platform }}' \
            --topology '${{ matrix.topology }}'

      - name: Verify OCI labels on the running architecture
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}@${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail
          config="$(docker image inspect "$RELEASE_IMAGE" --format '{{json .Config.Labels}}')"
          jq -e --arg value "$EXPECTED_VERSION" \
            '."org.opencontainers.image.version" == $value' <<<"$config" >/dev/null
          jq -e --arg value "$EXPECTED_REVISION" \
            '."org.opencontainers.image.revision" == $value' <<<"$config" >/dev/null
          jq -e \
            '."org.opencontainers.image.created" | length > 0' <<<"$config" >/dev/null
          jq -e \
            '."org.opencontainers.image.source" | length > 0' <<<"$config" >/dev/null

  engine-24-smoke:
    name: Docker Engine 24 and Compose 2.20 topologies
    needs:
      - validate
      - publish-image
      - public-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Docker Compose 2.20.0
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v2.20.0

      - name: Set up JDK for the TLS smoke truststore
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Start both topologies on Docker Engine 24
        env:
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}@${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail
          daemon_name="someday-engine-24-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            DOCKER_HOST= docker rm --force "$daemon_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          DOCKER_HOST= docker run --detach --privileged \
            --name "$daemon_name" \
            --platform linux/amd64 \
            --env DOCKER_TLS_CERTDIR= \
            --publish 127.0.0.1::2375 \
            --publish 127.0.0.1::31800 \
            --volume /tmp:/tmp \
            docker:24.0.9-dind@sha256:9b17a9f25adf17b88d0a013b4f00160754adf4b07ccbe9986664a49886c2c98e \
            --host=tcp://0.0.0.0:2375 \
            --tls=false >/dev/null
          daemon_address="$(
            DOCKER_HOST= docker port "$daemon_name" 2375/tcp | head -1
          )"
          health_address="$(
            DOCKER_HOST= docker port "$daemon_name" 31800/tcp | head -1
          )"
          [[ "${daemon_address##*:}" =~ ^[0-9]+$ ]]
          [[ "${health_address##*:}" =~ ^[0-9]+$ ]]
          export DOCKER_HOST="tcp://$daemon_address"
          export SOMEDAY_DOCKER_PUBLISHED_HOST="${health_address%:*}"
          export SOMEDAY_DOCKER_PUBLISHED_BIND_ADDRESS=0.0.0.0
          export SOMEDAY_DOCKER_PUBLISHED_PORT=31800
          export SOMEDAY_DOCKER_HEALTH_PORT="${health_address##*:}"
          export TMPDIR=/tmp
          for attempt in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then
              break
            fi
            if ((attempt == 60)); then
              printf 'Docker Engine 24 did not become ready.\n' >&2
              exit 1
            fi
            sleep 1
          done
          engine_version="$(docker version --format '{{.Server.Version}}')"
          [[ "$engine_version" == 24.* ]]
          [[ "$(docker compose version --short)" == '2.20.0' ]]
          ./scripts/server-release-compose-smoke \
            --image "$RELEASE_IMAGE" \
            --platform linux/amd64 \
            --topology all

  github-release:
    name: Publish GitHub Release
    needs:
      - validate
      - publish-image
      - public-image
      - runtime-smoke
      - engine-24-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Reconfirm that the tag still identifies the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          object="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          )"
          object_type="$(jq -r '.object.type' <<<"$object")"
          object_sha="$(jq -r '.object.sha' <<<"$object")"
          for _ in $(seq 1 5); do
            [[ "$object_type" == tag ]] || break
            object="$(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
            )"
            object_type="$(jq -r '.object.type' <<<"$object")"
            object_sha="$(jq -r '.object.sha' <<<"$object")"
          done
          [[ "$object_type" == commit ]]
          [[ "$object_sha" == "$GITHUB_SHA" ]]

      - name: Build the image-only deployment bundle
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package="someday-server-$VERSION"
          mkdir -p "release/$package"
          cp -R deploy "release/$package/deploy"
          find "release/$package/deploy" -name 'compose.source.yaml' -delete
          release_reference="$RELEASE_IMAGE@$DIGEST"
          while IFS= read -r env_file; do
            sed -i \
              "s#ghcr.io/sensefy/someday-server:X.Y.Z@sha256:<release-digest>#$release_reference#" \
              "$env_file"
            grep -Fqx "SOMEDAY_IMAGE=$release_reference" "$env_file"
          done < <(find "release/$package/deploy" -name '.env.example' -print)
          printf '%s\n' \
            "Image: $release_reference" \
            "Digest: $DIGEST" \
            'Platforms: linux/amd64, linux/arm64' \
            "Source: $GITHUB_SHA" >"release/$package/IMAGE.txt"
          tar -C release -czf "release/$package.tar.gz" "$package"
          (
            cd release
            sha256sum "$package.tar.gz" >"$package.tar.gz.sha256"
          )

      - name: Create the GitHub Release after every gate
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          printf '%s\n' \
            "Image: \`$RELEASE_IMAGE\`" \
            "Digest: \`$DIGEST\`" \
            '' \
            'Platforms: `linux/amd64`, `linux/arm64`.' >release-notes.md
          gh release create "$RELEASE_TAG" \
            "release/someday-server-$VERSION.tar.gz" \
            "release/someday-server-$VERSION.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Someday Server $VERSION" \
            --notes-file release-notes.md
