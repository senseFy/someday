name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for similar proposals.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: What should a successful experience look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: constraints
    attributes:
      label: Privacy, compatibility, or migration considerations
      description: Call out effects on local-first behavior, encrypted sync, schema, or supported platforms.
